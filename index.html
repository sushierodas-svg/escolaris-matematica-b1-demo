<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio Escolaris</title>
  <style>
    :root {
      --escolaris-orange: #db6015;
      --escolaris-gold: #f7be00;
      --escolaris-blue: #244b5a;
      --escolaris-red: #993921;
      --escolaris-light: #f0f8ff;
      --escolaris-white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      align-items: center;
      background:
        radial-gradient(circle at top left, rgba(247, 190, 0, 0.28), transparent 32%),
        radial-gradient(circle at bottom right, rgba(219, 96, 21, 0.18), transparent 32%),
        linear-gradient(180deg, var(--escolaris-light) 0%, var(--escolaris-white) 100%);
      color: var(--escolaris-blue);
      display: flex;
      font-family: "Segoe UI", Tahoma, Verdana, sans-serif;
      justify-content: center;
      line-height: 1.5;
      padding: 24px;
    }

    .home-card {
      background: var(--escolaris-white);
      border: 3px solid rgba(36, 75, 90, 0.12);
      border-radius: 28px;
      box-shadow: 0 18px 42px rgba(36, 75, 90, 0.18);
      max-width: 860px;
      padding: clamp(24px, 5vw, 48px);
      text-align: center;
      width: 100%;
    }

    .badge {
      background: var(--escolaris-gold);
      border-radius: 999px;
      color: var(--escolaris-blue);
      display: inline-block;
      font-weight: 900;
      letter-spacing: 0.04em;
      padding: 8px 16px;
      text-transform: uppercase;
    }

    h1 {
      color: var(--escolaris-blue);
      font-size: clamp(2rem, 5vw, 3.5rem);
      line-height: 1.1;
      margin: 18px 0 12px;
    }

    p {
      color: rgba(36, 75, 90, 0.78);
      font-size: clamp(1.05rem, 2vw, 1.2rem);
      font-weight: 650;
      margin: 0 auto;
      max-width: 620px;
    }

    .actions {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin-top: 30px;
    }

    .action-button {
      align-items: center;
      border-radius: 20px;
      color: var(--escolaris-white);
      display: flex;
      font-size: clamp(1.05rem, 2vw, 1.25rem);
      font-weight: 900;
      justify-content: center;
      min-height: 86px;
      padding: 18px;
      text-decoration: none;
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .action-button--math {
      background: var(--escolaris-orange);
      box-shadow: 0 12px 24px rgba(219, 96, 21, 0.24);
    }

    .action-button--presentation {
      background: var(--escolaris-blue);
      box-shadow: 0 12px 24px rgba(36, 75, 90, 0.22);
    }

    .action-button:hover {
      transform: translateY(-2px);
    }

    .action-button:focus-visible {
      outline: 4px solid rgba(247, 190, 0, 0.72);
      outline-offset: 4px;
    }

    @media (max-width: 680px) {
      body {
        padding: 14px;
      }

      .home-card {
        border-radius: 22px;
      }

      .actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="home-card" aria-labelledby="home-title">
    <span class="badge">Escolaris</span>
    <h1 id="home-title">Centro de demos</h1>
    <p>Selecciona el recurso que deseas abrir.</p>

    <nav class="actions" aria-label="Recursos disponibles">
      <a class="action-button action-button--math" href="lecciones/leccion-01-variables/lectura-interactiva.html">Ver Demo Matemática</a>
      <a class="action-button action-button--presentation" href="propuesta_sistema_maestro_escolaris_ia.html">Ver Presentación Sistema Maestro IA</a>
    </nav>
  </main>
</body>
</html>
